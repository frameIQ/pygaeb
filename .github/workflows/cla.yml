name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Required so the action can comment on PRs and store signatures.
# PR conversation comments go through the Issues API, hence issues: write.
permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the pyGAEB Contributor License Agreement and I hereby accept its terms.') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          # GITHUB_TOKEN is sufficient: signatures are stored in a branch of THIS repo.
          # (A PERSONAL_ACCESS_TOKEN is only needed to store them in a separate/private repo.)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Where the recorded signatures are stored (audit trail you own).
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/frameIQ/pygaeb/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'kalyanakannan,dependabot[bot]'
          custom-pr-sign-comment: 'I have read the pyGAEB Contributor License Agreement and I hereby accept its terms.'
          custom-notsigned-prcomment: >
            Thank you for your pull request! Before we can merge it, please read our
            [Contributor License Agreement](https://github.com/frameIQ/pygaeb/blob/main/CLA.md)
            and sign it by posting a **new comment** containing exactly the following
            sentence (without the surrounding quotes):
            "I have read the pyGAEB Contributor License Agreement and I hereby accept its terms."
          custom-allsigned-prcomment: '✅ All contributors have signed the CLA.'
