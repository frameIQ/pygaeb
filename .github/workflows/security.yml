name: Security audit

on:
  schedule:
    - cron: "23 6 * * 1"  # Mondays, 06:23 UTC
  workflow_dispatch:
  pull_request:
    paths: ["pyproject.toml", ".github/**"]

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pyGAEB with its extras
        run: pip install -e ".[dev,llm]"

      - name: Install pip-audit
        run: pip install "pip-audit==2.10.1"

      # filelock's fixes (4.x) are out of reach: every litellm up to 1.106.6 requires
      # filelock<4, and filelock 4 needs Python 3.11. pyGAEB never imports filelock, and all
      # of these need a local user who can write to the lock's directory (checked 2026-10-29).
      # Remove these ignores once litellm lifts the cap.
      - name: Audit the installed packages
        run: >-
          pip-audit --skip-editable --progress-spinner off
          --ignore-vuln CVE-2026-112940
          --ignore-vuln CVE-2026-112913
          --ignore-vuln CVE-2026-112907
          --ignore-vuln CVE-2026-112908
          --ignore-vuln CVE-2026-112909
          --ignore-vuln CVE-2026-112910
          --ignore-vuln CVE-2026-112911
          --ignore-vuln CVE-2026-112912
          --ignore-vuln CVE-2026-112915
          --ignore-vuln CVE-2026-112935
          --ignore-vuln CVE-2026-112936
          --ignore-vuln CVE-2026-112938
          --ignore-vuln CVE-2026-112939
