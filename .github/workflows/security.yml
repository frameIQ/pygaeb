name: Security audit

on:
  schedule:
    - cron: "23 6 * * 1"  # Mondays, 06:23 UTC
  workflow_dispatch:
  pull_request:
    paths: ["pyproject.toml", ".github/**"]

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pyGAEB with its extras
        run: pip install -e ".[dev,llm]"

      - name: Install pip-audit
        run: pip install "pip-audit==2.10.1"

      # filelock's fix (4.2.1) is out of reach: litellm 1.106 requires filelock<4, and
      # pyGAEB does not use filelock. Remove these ignores once litellm lifts the cap.
      - name: Audit the installed packages
        run: >-
          pip-audit --skip-editable --progress-spinner off
          --ignore-vuln CVE-2026-112940
          --ignore-vuln CVE-2026-112913
          --ignore-vuln CVE-2026-112907
