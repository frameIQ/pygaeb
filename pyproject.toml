[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyGAEB"
dynamic = ["version"]
description = "Python parser for GAEB DA XML construction data exchange files, with LLM-powered item classification"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "gaeb",
    "construction",
    "bim",
    "bill-of-quantities",
    "boq",
    "ava",
    "leistungsverzeichnis",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Floors sit past known advisories (lxml CVE-2026-41066, pydantic CVE-2024-3772)
# even where pyGAEB's own use is not exposed, so installs never resolve to them.
dependencies = [
    "lxml>=6.1",
    "pydantic>=2.4",
    "pydantic-settings>=2.5",
    "beautifulsoup4>=4.12",
    "ftfy>=6.1",
    "charset-normalizer>=3.0",
]

[project.optional-dependencies]
cli = ["click>=8.1"]
docx = ["python-docx>=1.1"]
excel = ["openpyxl>=3.1"]
# litellm 1.107.0 was a compromised release (credential stealer, 2026-10-21).
llm = ["litellm>=1.106.2,!=1.107.0", "instructor>=1.0"]
mcp = ["mcp>=1.30,<2"]
pandas = ["pandas>=2.2"]
pdf = ["reportlab>=4.0"]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "mypy",
    "ruff",
    "pytest-asyncio",
    "xmldiff>=2.6",
    "lxml-stubs",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "pypdf>=6.21.2",
    "python-docx>=1.1",
    "pandas>=2.2",
    "click>=8.1",
    "mcp>=1.30,<2",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.24",
    "mkdocs-section-index>=0.3",
]

[project.scripts]
pygaeb = "pygaeb.cli:main"
pygaeb-mcp = "pygaeb.mcp.server:main"

[project.urls]
Homepage = "https://github.com/frameiq/pygaeb"
Docs = "https://pygaeb.readthedocs.io"
Changelog = "https://github.com/frameiq/pygaeb/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "pygaeb/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pygaeb"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF", "T20"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*", "instructor", "instructor.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "reportlab", "reportlab.*",
    "sqlalchemy", "sqlalchemy.*",
    "pandas",
]
ignore_missing_imports = true
follow_imports = "skip"

# numpy's stubs use Python 3.12 syntax, which a 3.10 target cannot parse; typed
# packages (tiktoken via litellm) reach them once pandas installs numpy.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
